# KatWork fork checks (see KATWORK.md). Actions are pinned by commit.
name: KatWork

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  no-marks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/check-no-marks.sh --self-test
      - run: bash scripts/check-no-marks.sh

  katwork-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.97.1
      - name: The gated crates are not in the KatWork build graphs
        run: bash scripts/katwork-profile.sh
      - name: The gate test, with the gate off
        # The test file compiles only with the gate off: fail if it ran no test (zero tests pass green).
        run: |
          set -o pipefail
          cargo test --locked -p lightcraft-engine --no-default-features --test katwork_profile 2>&1 | tee katwork-profile-test.log
          grep -E 'test result: ok\. 2 passed; 0 failed' katwork-profile-test.log
      - name: The UI offers no update check and no download, with the gates off
        # One test binary per step, so a pass from another binary cannot hide a zero.
        run: |
          set -o pipefail
          cargo test --locked -p lightcraft-ui-egui --no-default-features --lib -- tests::katwork_profile:: 2>&1 | tee katwork-ui-test.log
          grep -E 'test result: ok\. 2 passed; 0 failed' katwork-ui-test.log
      - name: The CLI neither offers nor runs denoise-serve, with the gates off
        run: |
          set -o pipefail
          cargo test --locked -p lightcraft-cli --no-default-features --features denoise --test it -- denoise_serve_is_neither_offered_nor_run_without_network 2>&1 | tee katwork-cli-test.log
          grep -E 'test result: ok\. 1 passed; 0 failed' katwork-cli-test.log
